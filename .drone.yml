---
kind: pipeline
name: default
type: kubernetes

environment:
  APP_NAME: refugee-loan
  PROD_ENV: sas-ril-prod
  STG_ENV: sas-ril-stg
  UAT_ENV: sas-ril-uat
  BRANCH_ENV: sas-ril-branch
  REDIS_PERSISTENCE_ENABLED: "true"
  REDIS_PERSISTENCE_ACCESS_MODES: ReadWriteOnce
  REDIS_PERSISTENCE_STORAGE_CLASS: gp2-encrypted-eu-west-2b
  REDIS_PERSISTENCE_EXISTING_CLAIM: ""
  REDIS_PERSISTENCE_ANNOTATIONS_FILE: ""
  PRODUCTION_URL: www.apply-for-refugee-integration-loan.homeoffice.gov.uk
  IMAGE_URL: 340268328991.dkr.ecr.eu-west-2.amazonaws.com
  IMAGE_REPO: sas/refugee-integration-loans
  GIT_REPO: UKHomeOffice/refugee-integration-loan
  HOF_CONFIG: hof-services-config/Refugee_Integration_Loan
  NON_PROD_AVAILABILITY: Mon-Fri 00:01-23:59 Europe/London
  READY_FOR_TEST_DELAY: 20s

include_default_branch: &include_default_branch
  include:
    - master

include_default_and_feature_branches: &include_default_and_feature_branches
  include:
    - master
    - feature/*

trigger:
  branch:
    <<: *include_default_and_feature_branches

node_image_name: &node_image_name quay.io/ukhomeofficedigital/hof-nodejs:24.21.0-alpine3.24-v8@sha256:a0c438317862e595f45a51e7cb234a0c7e8c67aef2b886844d788dbe21c3b410

node_image: &node_image
  pull: if-not-exists
  image: *node_image_name

github_app_token_step: &github_app_token_step
  pull: if-not-exists
  image: *node_image_name
  volumes:
    - name: dockersock
      path: /root/.dockersock
  commands:
    - apk add --no-cache bash curl jq openssl
    - test -n "$GITHUB_APP_ID" || (echo "Missing GITHUB_APP_ID secret." && exit 1)
    - test -n "$GITHUB_APP_PRIVATE_KEY" || (echo "Missing GITHUB_APP_PRIVATE_KEY secret." && exit 1)
    - test -n "$GITHUB_APP_INSTALLATION_ID" || (echo "Missing GITHUB_APP_INSTALLATION_ID secret." && exit 1)
    - test -n "$OUTPUT_TOKEN_FILE" || (echo "Missing OUTPUT_TOKEN_FILE." && exit 1)
    - bash bin/generate_github_app_token.sh

github_app_token_secrets_ukho: &github_app_token_secrets_ukho
  GITHUB_APP_ID:
    from_secret: hof_ukho_gh_app_id
  GITHUB_APP_PRIVATE_KEY:
    from_secret: hof_ukho_gh_app_pk
  GITHUB_APP_INSTALLATION_ID:
    from_secret: hof_ukho_gh_app_install_id

github_app_token_secrets_hof: &github_app_token_secrets_hof
  GITHUB_APP_ID:
    from_secret: HOF_GH_APP_ID
  GITHUB_APP_PRIVATE_KEY:
    from_secret: HOF_GH_APP_PK
  GITHUB_APP_INSTALLATION_ID:
    from_secret: HOF_GH_APP_INSTALL_ID

clone_repos_step: &clone_repos_step
  image: alpine/git
  volumes:
    - name: dockersock
      path: /root/.dockersock
  commands:
    - test -s "$CLONE_TOKEN_FILE" || (echo "$CLONE_TOKEN_MISSING_MESSAGE" && exit 1)
    - export GITHUB_TOKEN="$(cat "$CLONE_TOKEN_FILE")"
    - git clone https://x-access-token:$${GITHUB_TOKEN}@github.com/UKHomeOfficeForms/hof-services-config.git
    - if [ "${CLONE_REPOS_PRUNE:-false}" = "true" ]; then find hof-services-config/* | grep -v $HOF_CONFIG | grep -v 'infrastructure' | xargs rm -rf; fi
    - rm -f "$CLONE_TOKEN_FILE"

linting: &linting
  <<: *node_image
  commands:
    - yarn run test:lint

unit_tests: &unit_tests
  <<: *node_image
  environment:
    NOTIFY_STUB: true
  commands:
    - yarn run test:unit

sonar_scanner: &sonar_scanner
  pull: always
  image: quay.io/ukhomeofficedigital/sonar-scanner:latest
  commands:
    - sonar-scanner -Dproject.settings=./sonar-project.properties

ui_integration_tests: &ui_integration_tests
  <<: *node_image
  environment:
    NOTIFY_STUB: true
    SESSION_SECRET:
      from_secret: session_secret_for_tests
  commands:
    - yarn run test:ui-integration

accessibility_tests: &accessibility_tests
  <<: *node_image
  resources:
      limits:
        cpu: 2000
        memory: 2048Mi
  # options: --user root
  environment:
    PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: true
    PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
    NOTIFY_STUB: true
    ENVIRONMENT: DRONE
    DRONE_DEBUG: true
    DRONE_TRACE: true
    DRONE_LOGS_TEXT: true
    DRONE_LOGS_PRETTY: true
    DRONE_LOGS_COLOR: true
    DRONE_SERVER:
      from_secret: drone_server
    DRONE_TOKEN:
      from_secret: drone_token
    SESSION_SECRET:
      from_secret: session_secret_for_tests
  volumes:
    - name: dockersock
      path: /root/.dockersock
  commands:
    - apk add --no-cache chromium
    - test -x "$PUPPETEER_EXECUTABLE_PATH"
    - yarn install --frozen-lockfile
    - yarn run test:accessibility

acceptance_tests: &acceptance_tests
  pull: if-not-exists
  image: mcr.microsoft.com/playwright:v1.62.0

steps:
  - name: generate_github_app_token_for_clone
    <<: *github_app_token_step
    environment:
      <<: *github_app_token_secrets_hof
      OUTPUT_TOKEN_FILE: /root/.dockersock/github_app_token_for_clone.txt
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: [push, pull_request]

  - name: clone_repos
    <<: *clone_repos_step
    environment:
      CLONE_TOKEN_FILE: /root/.dockersock/github_app_token_for_clone.txt
      CLONE_TOKEN_MISSING_MESSAGE: Missing GitHub App token file for clone step.
      CLONE_REPOS_PRUNE: "true"
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: [push, pull_request]
    depends_on:
      - generate_github_app_token_for_clone

  - name: setup
    <<: *node_image
    environment:
      NOTIFY_STUB: true
    commands:
      - yarn install --frozen-lockfile
      - yarn run postinstall
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: [push, pull_request]

  - name: linting
    <<: *linting
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: [push, pull_request]
    depends_on:
      - setup

  - name: unit_tests
    <<: *unit_tests
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: [push, pull_request]
    depends_on:
      - setup

  - name: sonar_scanner
    <<: *sonar_scanner
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: [push, pull_request]

  - name: ui_integration_tests
    <<: *ui_integration_tests
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: [push, pull_request]
    depends_on:
      - setup

  - name: accessibility_tests
    <<: *accessibility_tests
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: [push, pull_request]

  - name: build_image
    image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/dind
    commands:
      - n=0; while [ "$n" -lt 60 ] && [ ! docker stats --no-stream ]; do n=$(( n + 1 )); sleep 1; done
      - docker build --no-cache -t $${IMAGE_REPO}:$${DRONE_COMMIT_SHA} .
    volumes:
      - name: dockersock
        path: /var/run
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: [push, pull_request]
    depends_on: 
      - linting
      - unit_tests
      - accessibility_tests
      - ui_integration_tests

  - name: image_to_ecr
    image: plugins/ecr
    settings:
      access_key:
        from_secret: aws_access_key_id
      secret_key:
        from_secret: aws_secret_access_key
      region: eu-west-2
      repo: sas/refugee-integration-loans
      registry: 340268328991.dkr.ecr.eu-west-2.amazonaws.com
      tags:
        - latest_${DRONE_BRANCH}
        - ${DRONE_COMMIT_SHA}
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: [push, pull_request]
    depends_on: 
      - build_image

  # Trivy Security Scannner for scanning OS related vulnerabilities in Base image of Dockerfile
  - name: scan_image_os
    pull: always
    image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/trivy/client:latest
    resources:
      limits:
        cpu: 1000
        memory: 1024Mi
    environment:
      IMAGE_NAME: *node_image_name
      SEVERITY: MEDIUM,HIGH,CRITICAL --pkg-types os,library --dependency-tree
      FAIL_ON_DETECTION: true
      IGNORE_UNFIXED: true
      ALLOW_CVE_LIST_FILE: hof-services-config/infrastructure/trivy/.trivyignore.yaml
    when:
      event:
      - pull_request
      - push
      - tag
    depends_on:
      - clone_repos
  
  # Trivy Security Scannner for scanning nodejs packages in Yarn
  - name: scan_node_packages
    failure: ignore
    pull: always
    image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/trivy/client:latest
    resources:
      limits:
        cpu: 1000
        memory: 1024Mi
    environment:
      IMAGE_NAME: sas/refugee-integration-loans:${DRONE_COMMIT_SHA}
      SEVERITY: MEDIUM,HIGH,CRITICAL  --pkg-types os,library --dependency-tree
      FAIL_ON_DETECTION: true
      IGNORE_UNFIXED: false
      ALLOW_CVE_LIST_FILE: hof-services-config/infrastructure/trivy/.trivyignore.yaml
    volumes:
      - name: dockersock
        path: /root/.dockersock    
    when:
      event: [push, pull_request]
    depends_on:
      - clone_repos
      - build_image

  # Deploy to pull request UAT environment
  - name: deploy_to_branch
    pull: if-not-exists
    image: quay.io/ukhomeofficedigital/kd:v1.14.0
    environment:
      KUBE_SERVER: https://kube-api-notprod.notprod.acp.homeoffice.gov.uk
      KUBE_TOKEN:
        from_secret: kube_token_ril_acp_notprod
    volumes:
      - name: dockersock
        path: /root/.dockersock
    commands:
      - bin/deploy.sh $${BRANCH_ENV}
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: pull_request
    depends_on:
      - clone_repos
      - image_to_ecr

  - name: acceptance_tests_branch
    <<: *acceptance_tests
    commands:
      - export ACCEPTANCE_HOST_NAME=https://$${APP_NAME}-$${DRONE_SOURCE_BRANCH}.internal.$${BRANCH_ENV}.homeoffice.gov.uk
      - npx playwright install
      - npm run test:acceptance
    when:
      branch: 
        <<: *include_default_and_feature_branches
      event: pull_request
    depends_on:
      - deploy_to_branch

  - name: e2e_tests
    pull: if-not-exists
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    environment:
      SAS_HOF_EMAIL:
        from_secret: SAS_HOF_EMAIL
    volumes:
      - name: dockersock
        path: /root/.dockersock
    commands:
      - npm install -g n
      - n 24.21.0
      - hash -r
      - node --version
      - yarn install --frozen-lockfile
      - yarn playwright install --with-deps
      - test -s /root/.dockersock/branch_url.txt || (echo "Missing deployed branch URL at /root/.dockersock/branch_url.txt" && exit 1)
      - echo "Running Playwright e2e against https://$(cat /root/.dockersock/branch_url.txt)"
      - CI=true PLAYWRIGHT_BASE_URL="https://$(cat /root/.dockersock/branch_url.txt)" yarn test:e2e
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: pull_request
    depends_on:
      - deploy_to_branch

  - name: generate_github_app_token_for_e2e_report
    <<: *github_app_token_step
    environment:
      <<: *github_app_token_secrets_ukho
      OUTPUT_TOKEN_FILE: /root/.dockersock/github_app_token_for_e2e_report.txt
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: pull_request
      status: [success, failure]
    depends_on:
      - e2e_tests

  - name: publish_e2e_report_to_pr
    pull: if-not-exists
    image: *node_image_name
    volumes:
      - name: dockersock
        path: /root/.dockersock
    commands:
      - apk add --no-cache bash curl jq zip
      - test -n "$DRONE_PULL_REQUEST" || (echo "Missing DRONE_PULL_REQUEST. This step only supports pull_request builds." && exit 1)
      - export DRONE_REPO="$${DRONE_REPO:-$GIT_REPO}"
      - test -n "$DRONE_REPO" || (echo "Missing repository slug (DRONE_REPO/GIT_REPO)." && exit 1)
      - test -s /root/.dockersock/github_app_token_for_e2e_report.txt || (echo "Missing GitHub App token file from token generation step." && exit 1)
      - export GITHUB_APP_TOKEN="$(cat /root/.dockersock/github_app_token_for_e2e_report.txt)"
      - bash bin/publish_e2e_test_report.sh
      - rm -f /root/.dockersock/github_app_token_for_e2e_report.txt
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: pull_request
      status: [success, failure]
    depends_on:
      - generate_github_app_token_for_e2e_report

  # Deploy to Master UAT environment
  - name: deploy_to_uat
    pull: if-not-exists
    image: quay.io/ukhomeofficedigital/kd:v1.14.0
    environment:
      KUBE_SERVER: https://kube-api-notprod.notprod.acp.homeoffice.gov.uk
      KUBE_TOKEN:
        from_secret: kube_token_ril_acp_notprod
    commands:
      - bin/deploy.sh $${UAT_ENV}
    when:
      branch:
        <<: *include_default_branch
      event: push
    depends_on:
      - image_to_ecr

  - name: acceptance_tests_uat
    <<: *acceptance_tests
    commands:
      - export ACCEPTANCE_HOST_NAME=https://$${APP_NAME}.uat.internal.sas-notprod.homeoffice.gov.uk
      - npx playwright install
      - npm run test:acceptance
    when:
      branch: 
        <<: *include_default_branch
      event: push
    depends_on:
      - deploy_to_uat

  # Get pull request branch so correct PR UAT environment is torn down in the tear_down_branch step that follows
  - name: get_pr_branch
    pull: if-not-exists
    image: drone/cli:alpine@sha256:14409f7f7247befb9dd2effdb2f61ac40d1f5fbfb1a80566cf6f2f8d21f3be11
    environment:
      DRONE_SERVER:
        from_secret: drone_server
      DRONE_TOKEN:
        from_secret: drone_token
    volumes:
      - name: dockersock
        path: /root/.dockersock
    commands:
      - drone build info $GIT_REPO $DRONE_BUILD_NUMBER --format {{.Message}} | grep -o " '.*' " | tr -d "[ ']" | tr '[:upper:]' '[:lower:]' | tr '/' '-' > /root/.dockersock/branch_name.txt
    when:
      branch:
        <<: *include_default_branch
      event: push

  # Tear down pull request UAT environment
  - name: tear_down_branch
    pull: if-not-exists
    image: quay.io/ukhomeofficedigital/kd:v1.14.0
    environment:
      KUBE_SERVER: https://kube-api-notprod.notprod.acp.homeoffice.gov.uk
      KUBE_TOKEN:
        from_secret: kube_token_ril_acp_notprod
    volumes:
      - name: dockersock
        path: /root/.dockersock
    commands:
      - bin/deploy.sh tear_down
    when:
      branch: 
        <<: *include_default_branch
      event: push
    depends_on:
      - get_pr_branch
      - deploy_to_uat

  # Deploy to Staging environment
  - name: deploy_to_stg
    pull: if-not-exists
    image: quay.io/ukhomeofficedigital/kd:v1.14.0
    environment:
      KUBE_SERVER: https://kube-api-prod.prod.acp.homeoffice.gov.uk
      KUBE_TOKEN:
        from_secret: kube_token_ril_acp_prod
    commands:
      - bin/deploy.sh $${STG_ENV}
    when:
      branch:
        <<: *include_default_branch
      event: push
    depends_on:
      - image_to_ecr
      - deploy_to_uat

  # Checks a build being promoted has passed, is on master which effectively means a healthy build on Staging
  - name: sanity_check_build_prod
    pull: if-not-exists
    image: drone/cli:alpine@sha256:14409f7f7247befb9dd2effdb2f61ac40d1f5fbfb1a80566cf6f2f8d21f3be11
    environment:
      DRONE_SERVER:
        from_secret: drone_server
      DRONE_TOKEN:
        from_secret: drone_token
    commands:
      - bin/sanity_check_build.sh
    when:
      target: PROD
      event: promote

  - name: generate_github_app_token_for_clone_prod
    <<: *github_app_token_step
    environment:
      <<: *github_app_token_secrets_hof
      OUTPUT_TOKEN_FILE: /root/.dockersock/github_app_token_for_clone_prod.txt
    when:
      target: PROD
      event: promote

  - name: clone_repos_prod
    <<: *clone_repos_step
    environment:
      CLONE_TOKEN_FILE: /root/.dockersock/github_app_token_for_clone_prod.txt
      CLONE_TOKEN_MISSING_MESSAGE: Missing GitHub App token file for PROD clone step.
    when:
      target: PROD
      event: promote
    depends_on:
      - generate_github_app_token_for_clone_prod

  # Deploy to Production environment
  - name: deploy_to_prod
    pull: if-not-exists
    image: quay.io/ukhomeofficedigital/kd:v1.14.0
    environment:
      KUBE_SERVER: https://kube-api-prod.prod.acp.homeoffice.gov.uk
      KUBE_TOKEN:
        from_secret: kube_token_ril_acp_prod
    commands:
      - bin/deploy.sh $${PROD_ENV}
    when:
      target: PROD
      event: promote
    depends_on:
      - clone_repos_prod

  # CRON job step that tears down our pull request UAT environments
  - name: cron_tear_down
    pull: if-not-exists
    image: quay.io/ukhomeofficedigital/kd:v1.14.0
    environment:
      KUBE_SERVER: https://kube-api-notprod.notprod.acp.homeoffice.gov.uk
      KUBE_TOKEN:
        from_secret: kube_token_ril_acp_notprod
    commands:
      - bin/clean_up.sh $${BRANCH_ENV}
    when:
      cron: tear_down_pr_envs
      event: cron

  # CRON job steps that runs security scans using Trivy
  - name: generate_github_app_token_for_clone_cron
    <<: *github_app_token_step
    environment:
      <<: *github_app_token_secrets_hof
      OUTPUT_TOKEN_FILE: /root/.dockersock/github_app_token_for_clone_cron.txt
    when:
      cron: security_scans
      event: cron

  - name: cron_clone_repos
    <<: *clone_repos_step
    environment:
      CLONE_TOKEN_FILE: /root/.dockersock/github_app_token_for_clone_cron.txt
      CLONE_TOKEN_MISSING_MESSAGE: Missing GitHub App token file for CRON clone step.
    when:
      cron: security_scans
      event: cron
    depends_on:
      - generate_github_app_token_for_clone_cron

  - name: cron_build_image
    image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/dind
    commands:
      - docker build --no-cache -t $${IMAGE_REPO}:$${DRONE_COMMIT_SHA} .
    volumes:
      - name: dockersock
        path: /var/run
    when:
      cron: security_scans
      event: cron
    depends_on:
      - cron_clone_repos

  - name: cron_trivy_scan_image_os
    image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/trivy/client:latest
    pull: always
    environment:
        IMAGE_NAME: *node_image_name
        SEVERITY: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --dependency-tree
        FAIL_ON_DETECTION: true
        IGNORE_UNFIXED: false
    when:
      cron: security_scans
      event: cron
    depends_on:
      - cron_clone_repos

  - name: cron_trivy_scan
    image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/trivy/client:latest
    pull: always
    environment:
      IMAGE_NAME: sas/refugee-integration-loans:${DRONE_COMMIT_SHA}
      SEVERITY: MEDIUM,HIGH,CRITICAL  --pkg-types os,library
      FAIL_ON_DETECTION: true
      IGNORE_UNFIXED: false
      ALLOW_CVE_LIST_FILE: hof-services-config/Refugee_Integration_Loan/trivy-cve-exceptions.txt
    when:
      cron: security_scans
      event: cron
      status:
        - success
        - failure
    depends_on:
      - cron_clone_repos
      - cron_build_image

  - name: cron_nightly_e2e_tests
    pull: if-not-exists
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    environment:
      SAS_HOF_EMAIL:
        from_secret: SAS_HOF_EMAIL
      NIGHTLY_E2E_BASE_URL:
        from_secret: NIGHTLY_E2E_BASE_URL
    volumes:
      - name: dockersock
        path: /root/.dockersock
    commands:
      - npm install -g n
      - n 24.21.0
      - hash -r
      - node --version
      - yarn install --frozen-lockfile
      - yarn playwright install --with-deps
      - |
        test -n "$NIGHTLY_E2E_BASE_URL" || (echo "Missing NIGHTLY_E2E_BASE_URL environment value." && exit 1)

        case "$NIGHTLY_E2E_BASE_URL" in
          http://*|https://*) base_url="$NIGHTLY_E2E_BASE_URL" ;;
          *) base_url="https://$NIGHTLY_E2E_BASE_URL" ;;
        esac
        echo "Using PLAYWRIGHT_BASE_URL=$base_url"

        run_output_path="/root/.dockersock/nightly-playwright-run-output.txt"
        summary_output_path="/root/.dockersock/nightly-playwright-summary.txt"

        rm -f "$run_output_path" "$summary_output_path"
        yarn bddgen

        set +e
        PLAYWRIGHT_BASE_URL="$base_url" yarn playwright test --reporter=line > "$run_output_path" 2>&1
        playwright_exit_code=$?
        set -e

        tail -n 60 "$run_output_path" || true
        node bin/summarise_playwright_report.js "$run_output_path" "$summary_output_path"

        exit "$playwright_exit_code"
    when:
      cron: nightly_e2e_playwright
      event: cron

  - name: cron_notify_slack_nightly_e2e
    pull: if-not-exists
    image: *node_image_name
    environment:
      SLACK_WEBHOOK:
        from_secret: slack_sas_hof_e2e_tests_webhook
      NIGHTLY_E2E_BASE_URL:
        from_secret: NIGHTLY_E2E_BASE_URL
    volumes:
      - name: dockersock
        path: /root/.dockersock
    commands:
      - apk add --no-cache curl jq
      - test -n "$SLACK_WEBHOOK" || (echo "Missing slack_sas_hof_e2e_tests_webhook secret." && exit 1)
      - test -f /root/.dockersock/nightly-playwright-summary.txt || printf "Playwright Nightly Summary\nSummary artifact missing.\n" > /root/.dockersock/nightly-playwright-summary.txt
      - |
        payload=$(jq -n \
          --arg status "$DRONE_BUILD_STATUS" \
          --arg repo "$DRONE_REPO" \
          --arg branch "$DRONE_BRANCH" \
          --arg commit "$DRONE_COMMIT_SHA" \
          --arg build_number "$DRONE_BUILD_NUMBER" \
          --arg build_link "$DRONE_BUILD_LINK" \
          --arg environment "$NIGHTLY_E2E_BASE_URL" \
          --rawfile summary /root/.dockersock/nightly-playwright-summary.txt \
          '{
            text: ("Nightly Playwright Tests for " + $repo + " finished with status: " + $status),
            blocks: [
              {
                type: "section",
                text: {
                  type: "mrkdwn",
                  text: ("*Nightly Playwright Tests Summary*\nStatus: " + $status + "\nBranch: " + $branch + "\nEnvironment: " + $environment + "\nBuild: #" + $build_number + " " + $build_link)
                }
              },
              {
                type: "section",
                text: {
                  type: "mrkdwn",
                  text: ("```" + $summary + "```")
                }
              }
            ]
          }')
        http_code=$(curl -sS -o /tmp/slack_response.txt -w "%{http_code}" \
          -X POST \
          -H "Content-type: application/json" \
          --data "$payload" \
          "$SLACK_WEBHOOK")
        echo "Slack webhook HTTP status: $http_code"
        echo "Slack webhook response body:"
        cat /tmp/slack_response.txt
        test "$http_code" = "200" || (echo "Slack webhook call failed" && exit 1)
    when:
      cron: nightly_e2e_playwright
      event: cron
      status: [success, failure]
    depends_on:
      - cron_nightly_e2e_tests

  # Slack notification upon a CRON job fail
  - name: cron_notify_slack_tear_down_pr_envs
    pull: if-not-exists
    image: plugins/slack
    settings:
      channel: sas-build
      failure: ignore
      icon_url: http://readme.drone.io/0.5/logo_dark.svg
      icon.url: http://readme.drone.io/0.5/logo_dark.svg
      template: "CRON Job {{build.deployTo}} of RIL has {{build.status}} - <{{build.link}}|#{{build.number}}> {{#success build.status}}\n  :thumbsup: :thumbsup: :thumbsup:\n{{else}}\n  :x: :x: :x:\n{{/success}} Author: {{build.author}}\n\nDuration: {{since job.started}}\n\nJob: <{{build.link}}|#{{build.number}}>\n\nCommit: {{build.commit}}\n"
      username: Drone
      webhook:
        from_secret: slack_webhook
    when:
      cron: tear_down_pr_envs
      event: cron
      status: failure
    depends_on:
      - cron_tear_down

  - name: cron_notify_slack_security_scans
    pull: if-not-exists
    image: plugins/slack
    settings:
      channel: sas-build
      failure: ignore
      icon_url: http://readme.drone.io/0.5/logo_dark.svg
      icon.url: http://readme.drone.io/0.5/logo_dark.svg
      template: "CRON Job {{build.deployTo}} of RIL has {{build.status}} - <{{build.link}}|#{{build.number}}> {{#success build.status}}\n  :thumbsup: :thumbsup: :thumbsup:\n{{else}}\n  :x: :x: :x:\n{{/success}} Author: {{build.author}}\n\nDuration: {{since job.started}}\n\nJob: <{{build.link}}|#{{build.number}}>\n\nCommit: {{build.commit}}\n"
      username: Drone
      webhook:
        from_secret: slack_webhook
    when:
      cron: security_scans
      event: cron
      status: failure
    depends_on:
      - cron_trivy_scan_image_os
      - cron_trivy_scan

services:
  - name: docker
    image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/dind

  # Redis session setup in background so ui integration tests can run
  - name: session
    image: redis
    volumes:
      - name: dockersock
        path: /var/run

volumes:
  - name: dockersock
    temp: {}
